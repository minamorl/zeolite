plugins:
  - rubocop-minitest

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - vendor/**/*
    - tmp/**/*

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 20
  Exclude:
    - test/**/*
    - examples/**/*

Metrics/AbcSize:
  Max: 20
  Exclude:
    - test/**/*
    - examples/**/*

Metrics/BlockLength:
  Exclude:
    - test/**/*
    - examples/**/*
    - "*.gemspec"

Metrics/ClassLength:
  Exclude:
    - test/**/*

Metrics/ModuleLength:
  Exclude:
    - test/**/*

Layout/LineLength:
  Max: 110
  Exclude:
    - test/**/*

Minitest/MultipleAssertions:
  Enabled: false
